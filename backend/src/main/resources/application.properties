spring.application.name=coffeelab
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

spring.datasource.url=jdbc:postgresql://${PGHOST_UNPOOLED:${PGHOST:localhost}}:5432/${PGDATABASE:${POSTGRES_DB:coffeelab}}?sslmode=${PGSSLMODE:prefer}
spring.datasource.username=${PGUSER:${POSTGRES_USER:coffeelab}}
spring.datasource.password=${PGPASSWORD:${POSTGRES_PASSWORD:coffeelab}}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

server.port=${PORT:8080}
management.endpoints.web.exposure.include=health

app.host-name=${HOST_NAME:Dulo}
app.time-zone=${APP_TIME_ZONE:Europe/Skopje}
app.cors-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
app.gemini.api-key=${GEMINI_API_KEY:}
app.gemini.model=${GEMINI_MODEL:gemini-3.5-flash-lite}
app.gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
